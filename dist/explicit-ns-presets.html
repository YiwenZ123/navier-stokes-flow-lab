      &lt;progress class=&quot;ns-progress&quot; max=&quot;20&quot; value=&quot;0&quot; aria-label=&quot;已推进的物理时间步&quot;&gt;&lt;/progress&gt;
      &lt;ol class=&quot;ns-stages&quot; aria-label=&quot;每个时间步的计算顺序&quot;&gt;
        &lt;li&gt;计算压力方程右端 &lt;span class=&quot;text-small&quot;&gt;式（6）&lt;/span&gt;&lt;/li&gt;
        &lt;li data-pressure-stage&gt;Jacobi 压力迭代&lt;/li&gt;
        &lt;li&gt;压力收敛&lt;/li&gt;
        &lt;li&gt;显式更新速度 &lt;span class=&quot;text-small&quot;&gt;式（4）（5）&lt;/span&gt;&lt;/li&gt;
      &lt;/ol&gt;
      &lt;dl class=&quot;ns-values tabular-nums&quot;&gt;
        &lt;div&gt;&lt;dt&gt;压力迭代 &lt;i&gt;k&lt;/i&gt;&lt;/dt&gt;&lt;dd data-sweeps&gt;—&lt;/dd&gt;&lt;/div&gt;
        &lt;div&gt;&lt;dt&gt;压力最大残差&lt;/dt&gt;&lt;dd data-residual&gt;—&lt;/dd&gt;&lt;/div&gt;
        &lt;div&gt;&lt;dt&gt;速度最大离散散度&lt;/dt&gt;&lt;dd data-divergence&gt;—&lt;/dd&gt;&lt;/div&gt;
      &lt;/dl&gt;
      &lt;p class=&quot;ns-message text-small&quot; role=&quot;status&quot; data-message&gt;&lt;/p&gt;
      &lt;p class=&quot;ns-diagnostic text-small&quot; data-diagnostic&gt;&lt;/p&gt;
      &lt;span class=&quot;ns-color-probe&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;style&gt;

&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;

  // Keep this sandboxed copy synchronized with spatial-grid.js.
  const spatialGrid = { intervals: 18, length: 6.283185307179586 };
  const size = spatialGrid.intervals + 1;
  const finalTime = 1.2;
  const timeStepOptions = [0.025, 0.03, 0.05, 0.06, 0.1, 0.15, 0.2, 0.3, 0.4, 0.6, 1.2];
  let dt = 0.06;
  let pressureMethod = &#x27;jacobi&#x27;;
  let pressureOmega = 1.5;
  const pressureMethods = { jacobi: &#x27;Jacobi&#x27;, &#x27;gauss-seidel&#x27;: &#x27;Gauss–Seidel&#x27;, sor: &#x27;SOR&#x27; };
  const pressureOmegaOptions = [1, 1.1, 1.2, 1.3, 1.5, 1.7, 1.9];
  let endLayer = Math.round(finalTime / dt);
  const density = 1;
  const viscosity = 0.025;
  const driftX = 0.92;
  const driftY = 0.78;
  const initialConditions = [
    { id: &#x27;taylor-green&#x27;, kind: &#x27;vortex&#x27;, amplitude: 0.52, wave: 1 },
    { id: &#x27;weak-vortex&#x27;, kind: &#x27;vortex&#x27;, amplitude: 0.25, wave: 1 },
    { id: &#x27;strong-vortex&#x27;, kind: &#x27;vortex&#x27;, amplitude: 0.70, wave: 1 },
    { id: &#x27;multi-vortex&#x27;, kind: &#x27;vortex&#x27;, amplitude: 0.35, wave: 2 },
    { id: &#x27;horizontal-shear&#x27;, kind: &#x27;shear&#x27;, axis: &#x27;x&#x27;, amplitude: 0.50, wave: 1 },
    { id: &#x27;vertical-shear&#x27;, kind: &#x27;shear&#x27;, axis: &#x27;y&#x27;, amplitude: 0.50, wave: 1 },
    { id: &#x27;uniform&#x27;, kind: &#x27;uniform&#x27;, amplitude: 0, wave: 1 }
  ];
  let initialCondition = initialConditions[0];
  const length = spatialGrid.length;
  const h = length / spatialGrid.intervals;
  const hSquared = h * h;
  const tolerance = 0.001;
  const sweepLimit = 1800;
  let pressureScale = 0.15;
  let sourceScale = 0.55;

  const field = () =&gt; new Float64Array(size * size);
  const at = (i, j) =&gt; j * size + i;
  const onBoundary = (i, j) =&gt; i === 0 || j === 0 || i === size - 1 || j === size - 1;
  const u = field();
  const v = field();
  const nextU = field();
  const nextV = field();
  const source = field();
  let pressure = field();
  let nextPressure = field();
  let layer, pressureLayer, sweep, residual, divergence, phase, timer;
  let initialPerturbationRms, perturbationRatio, transportIndicator, failureMessage;

  function eachInterior(visit) {
    for (let j = 1; j &lt; size - 1; j++) {
      for (let i = 1; i &lt; size - 1; i++) visit(at(i, j));
    }
  }

  function exactValues(i, j, time, amplitude) {
    const wave = initialCondition.wave;
    const x = wave * (i * h - driftX * time);
    const y = wave * (j * h - driftY * time);
    if (initialCondition.kind === &#x27;shear&#x27;) {
      return initialCondition.axis === &#x27;x&#x27;
        ? { u: driftX + amplitude * Math.sin(y), v: driftY, p: 0 }
        : { u: driftX, v: driftY + amplitude * Math.sin(x), p: 0 };
    }
    return {
      u: driftX + amplitude * Math.sin(x) * Math.cos(y),
      v: driftY - amplitude * Math.cos(x) * Math.sin(y),
      p: density * amplitude ** 2 * (Math.cos(2 * x) + Math.cos(2 * y)) / 4
    };
  }

  function prescribedValues(time, boundaryOnly, write) {
    const decayRate = initialCondition.kind === &#x27;shear&#x27; ? 1 : 2;
    const amplitude = initialCondition.amplitude * Math.exp(-decayRate * initialCondition.wave ** 2 * viscosity * time);
    for (let j = 0; j &lt; size; j++) {
      for (let i = 0; i &lt; size; i++) {
        if (!boundaryOnly || onBoundary(i, j)) write(at(i, j), exactValues(i, j, time, amplitude));
      }
    }
  }

  const derivativeX = (q, a) =&gt; (q[a + 1] - q[a - 1]) / (2 * h);
  const derivativeY = (q, a) =&gt; (q[a + size] - q[a - size]) / (2 * h);
  const neighborSum = (q, a) =&gt; q[a - 1] + q[a + 1] + q[a - size] + q[a + size];
  const laplacian = (q, a) =&gt; (neighborSum(q, a) - 4 * q[a]) / hSquared;

  function maxDivergence() {
    let maximum = 0;
    eachInterior(a =&gt; { maximum = Math.max(maximum, Math.abs(derivativeX(u, a) + derivativeY(v, a))); });
    return maximum;
  }

  function maxResidual() {
    let maximum = 0;
    eachInterior(a =&gt; { maximum = Math.max(maximum, Math.abs(laplacian(pressure, a) - source[a])); });
    return maximum;
  }

  function velocityMetrics(horizontal = u, vertical = v) {
    let sum = 0;
    let maximumTransport = 0;
    let finite = true;
    let reversed = false;
    eachInterior(a =&gt; {
      finite = finite &amp;&amp; Number.isFinite(horizontal[a]) &amp;&amp; Number.isFinite(vertical[a]);
      reversed = reversed || horizontal[a] &lt; 0 || vertical[a] &lt; 0;
      sum += (horizontal[a] - driftX) ** 2 + (vertical[a] - driftY) ** 2;
      maximumTransport = Math.max(maximumTransport, Math.abs(horizontal[a]) + Math.abs(vertical[a]));
    });
    return {
      rms: Math.sqrt(sum / ((size - 2) ** 2)), finite, reversed,
      indicator: dt * maximumTransport / h + 4 * viscosity * dt / hSquared
    };
  }

  function reset() {
    layer = 0;
    pressureLayer = 0;
    sweep = 0;
    residual = null;
    phase = &#x27;initial&#x27;;
    failureMessage = &#x27;&#x27;;
    pressure.fill(0);
    nextPressure.fill(0);
    source.fill(0);
    pressureScale = initialCondition.kind === &#x27;vortex&#x27; ? Math.max(0.05, Math.ceil(initialCondition.amplitude ** 2 / 2 / 0.05) * 0.05) : 0.05;
    sourceScale = initialCondition.kind === &#x27;vortex&#x27; ? Math.max(0.05, Math.ceil(2 * initialCondition.amplitude ** 2 * initialCondition.wave ** 2 / 0.05) * 0.05) : 0.05;
    prescribedValues(0, false, (a, exact) =&gt; { u[a] = exact.u; v[a] = exact.v; });
    setPressureBoundary();
    divergence = maxDivergence();
    const metrics = velocityMetrics();
    initialPerturbationRms = metrics.rms;
    perturbationRatio = initialPerturbationRms &gt; 1e-12 ? 1 : null;
    transportIndicator = metrics.indicator;
  }

  function setPressureBoundary() {
    prescribedValues(layer * dt, true, (a, exact) =&gt; {
      pressure[a] = exact.p;
      nextPressure[a] = exact.p;
    });
  }

  function buildSource() {
    eachInterior(a =&gt; {
      const ux = derivativeX(u, a);
      const uy = derivativeY(u, a);
      const vx = derivativeX(v, a);
      const vy = derivativeY(v, a);
      source[a] = -density * (ux * ux + 2 * uy * vx + vy * vy);
    });
    pressureLayer = layer;
    setPressureBoundary();
    sweep = 0;
    residual = maxResidual();
    phase = &#x27;source&#x27;;
  }

  function pressureSweep() {
    if (pressureMethod === &#x27;jacobi&#x27;) {
      // A separate array keeps every neighbor at the previous iteration.
      eachInterior(a =&gt; { nextPressure[a] = (neighborSum(pressure, a) - hSquared * source[a]) / 4; });
      [pressure, nextPressure] = [nextPressure, pressure];
    } else {
      const omega = pressureMethod === &#x27;sor&#x27; ? pressureOmega : 1;
      // Row-major, in-place sweep: west/south values have already been updated.
      // Only interior nodes change; the prescribed pressure boundary stays fixed.
      eachInterior(a =&gt; {
        const updated = (neighborSum(pressure, a) - hSquared * source[a]) / 4;
        pressure[a] += omega * (updated - pressure[a]);
      });
    }
    sweep++;
    // Evaluate the completed field, never a mix of pre- and post-sweep residuals.
    residual = maxResidual();
  }

  function advanceVelocity() {
    eachInterior(a =&gt; {
      const advect = q =&gt; (u[a] * (q[a] - q[a - 1]) + v[a] * (q[a] - q[a - size])) / h;
      nextU[a] = u[a] + dt * (-advect(u) - derivativeX(pressure, a) / density + viscosity * laplacian(u, a));
      nextV[a] = v[a] + dt * (-advect(v) - derivativeY(pressure, a) / density + viscosity * laplacian(v, a));
    });
    prescribedValues((layer + 1) * dt, true, (a, exact) =&gt; { nextU[a] = exact.u; nextV[a] = exact.v; });
    const metrics = velocityMetrics(nextU, nextV);
    if (!metrics.finite || !Number.isFinite(metrics.rms)) {
      phase = &#x27;velocity-error&#x27;;
      failureMessage = `第 ${layer + 1} 层产生非有限速度，已停止；图中保留第 ${layer} 层的有效速度。`;
      return;
    }
    u.set(nextU);
    v.set(nextV);
    layer++;
    divergence = maxDivergence();
    perturbationRatio = initialPerturbationRms &gt; 1e-12 ? metrics.rms / initialPerturbationRms : null;
    transportIndicator = metrics.indicator;
    if (perturbationRatio !== null &amp;&amp; perturbationRatio &gt;= 20) {
      phase = &#x27;velocity-error&#x27;;
      failureMessage = &#x27;速度扰动 RMS 超过初值 20 倍，触发数值幅值保护，已停止后续推进。&#x27;;
    } else if (metrics.reversed) {
      phase = &#x27;reverse-flow&#x27;;
      failureMessage = &#x27;速度出现反向，课件的向后差分已不再迎风，演示暂停；「结果对比」使用按流向选择的迎风差分。&#x27;;
    } else {
      phase = layer === endLayer ? &#x27;complete&#x27; : &#x27;advanced&#x27;;
    }
  }

  function step(batch = 1) {
    if (phase === &#x27;initial&#x27; || phase === &#x27;advanced&#x27;) {
      buildSource();
    } else if (phase === &#x27;source&#x27; || phase === &#x27;pressure&#x27;) {
      for (let i = 0; i &lt; batch &amp;&amp; residual &gt; tolerance &amp;&amp; sweep &lt; sweepLimit; i++) pressureSweep();
      if (residual &lt;= tolerance) phase = &#x27;converged&#x27;;
      else if (!Number.isFinite(residual) || sweep === sweepLimit) {
        phase = &#x27;error&#x27;;
        failureMessage = `压力迭代未收敛（最多 ${sweepLimit} 轮），已暂停；这与时间离散的数值发散不同。`;
      }
      else phase = &#x27;pressure&#x27;;
    } else if (phase === &#x27;converged&#x27;) {
      advanceVelocity();
    }
  }

  const root = document.getElementById(&#x27;explicit-ns-animation&#x27;);
  const find = selector =&gt; root.querySelector(selector);
  const canvas = find(&#x27;canvas&#x27;);
  const context = canvas.getContext(&#x27;2d&#x27;);
  const probe = find(&#x27;.ns-color-probe&#x27;);
  const play = find(&#x27;[data-play]&#x27;);
  const singleStep = find(&#x27;[data-step]&#x27;);
  const presetSelect = find(&#x27;#ns-preset&#x27;);
  const dtSelect = find(&#x27;#ns-dt&#x27;);
  const pressureMethodSelect = find(&#x27;#ns-pressure-method&#x27;);
  const pressureOmegaSelect = find(&#x27;#ns-pressure-omega&#x27;);
  const stages = Array.from(root.querySelectorAll(&#x27;.ns-stages li&#x27;));
  const reducedMotion = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  const stageIndex = { source: 0, pressure: 1, converged: 2, advanced: 3, complete: 3, error: 1, &#x27;velocity-error&#x27;: 3, &#x27;reverse-flow&#x27;: 3 };
  const messages = {
    initial: &#x27;初始速度已给定。&#x27;,
    source: &#x27;右端已计算，准备迭代压力。&#x27;,
    pressure: &#x27;本轮仅更新压力，速度仍在当前时间层。&#x27;,
    converged: &#x27;最大残差 ≤ 10⁻³，下一步更新速度。&#x27;,
    advanced: &#x27;速度已更新，物理时间增加 Δt。&#x27;,
    complete: &#x27;已到达本次计算终点。&#x27;,
    error: &#x27;压力未收敛，已暂停时间推进。&#x27;,
    &#x27;velocity-error&#x27;: &#x27;速度数值异常，已暂停时间推进。&#x27;,
    &#x27;reverse-flow&#x27;: &#x27;速度反向，已暂停时间推进。&#x27;
  };
  const terminal = () =&gt; [&#x27;complete&#x27;, &#x27;error&#x27;, &#x27;velocity-error&#x27;, &#x27;reverse-flow&#x27;].includes(phase);
  const playing = () =&gt; timer !== undefined;

  function themeColor(token) {
    probe.style.color = `var(--${token}, var(--foreground))`;
    return getComputedStyle(probe).color;
  }

  function draw() {
    const width = canvas.getBoundingClientRect().width;
    if (width === 0) return;
    const ratio = window.devicePixelRatio || 1;
    const pixels = Math.round(width * ratio);
    if (canvas.width !== pixels || canvas.height !== pixels) canvas.width = canvas.height = pixels;
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, width);

    const background = themeColor(&#x27;background&#x27;);
    const foreground = themeColor(&#x27;foreground&#x27;);
    const border = themeColor(&#x27;border&#x27;);
    const blue = themeColor(&#x27;blue&#x27;);
    const orange = themeColor(&#x27;orange&#x27;);
    const left = 19;
    const top = 9;
    const side = width - 32;
    const cell = side / spatialGrid.intervals;
    const bottom = top + side;
    const showSource = phase === &#x27;source&#x27;;
    const colors = showSource ? source : pressure;
    const scale = showSource ? sourceScale : pressureScale;

    context.fillStyle = background;
    context.fillRect(left, top, side, side);
    for (let j = 0; j &lt; spatialGrid.intervals; j++) {
      for (let i = 0; i &lt; spatialGrid.intervals; i++) {
        const value = (colors[at(i, j)] + colors[at(i + 1, j)]
          + colors[at(i, j + 1)] + colors[at(i + 1, j + 1)]) / 4;
        context.globalAlpha = 0.72 * Math.min(1, Math.abs(value) / scale);
        context.fillStyle = value &lt; 0 ? blue : orange;
        context.fillRect(left + i * cell, bottom - (j + 1) * cell, cell, cell);
      }
    }
    context.globalAlpha = 1;
    context.strokeStyle = border;
    context.lineWidth = 0.7;
    context.beginPath();
    for (let i = 0; i &lt; size; i++) {
      const offset = i * cell;
      context.moveTo(left + offset, top);
      context.lineTo(left + offset, bottom);
      context.moveTo(left, top + offset);
      context.lineTo(left + side, top + offset);
    }
    context.stroke();

    context.beginPath();
    for (let j = 1; j &lt; size - 1; j += 2) {
      for (let i = 1; i &lt; size - 1; i += 2) {
        const a = at(i, j);
        const x = left + i * cell;
        const y = bottom - j * cell;
        const dx = 0.73 * cell * u[a];
        const dy = -0.73 * cell * v[a];
        const endX = x + dx * 0.5;
        const endY = y + dy * 0.5;
        const angle = Math.atan2(dy, dx);
        const head = Math.min(4.5, 0.33 * Math.hypot(dx, dy));
        context.moveTo(x - dx * 0.5, y - dy * 0.5);
        context.lineTo(endX, endY);
        context.lineTo(endX - head * Math.cos(angle - 0.58), endY - head * Math.sin(angle - 0.58));
        context.moveTo(endX, endY);
        context.lineTo(endX - head * Math.cos(angle + 0.58), endY - head * Math.sin(angle + 0.58));
      }
    }
    context.strokeStyle = foreground;
    context.lineWidth = 1.2;
    context.lineCap = &#x27;round&#x27;;
    context.stroke();
    context.fillStyle = foreground;
    context.font = &#x27;12px system-ui, sans-serif&#x27;;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (globalThis.parent !== globalThis) {
          const bodyStyle = getComputedStyle(document.body);
          const padding = (Number.parseFloat(bodyStyle.paddingTop) || 0)
            + (Number.parseFloat(bodyStyle.paddingBottom) || 0);
          globalThis.parent.postMessage({
            type: "cfd-explicit-height",
            height: Math.ceil(height + padding),
          }, "*");
        }
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>


<script id="cfd-language-bridge">
(() => {
  const frame = document.getElementById('codex-visualization');
  let language = 'en';
  try { if (localStorage.getItem('cfd-language') === 'zh') language = 'zh'; } catch {}
  const parameter = new URL(location.href).searchParams.get('lang');
  if (parameter === 'en' || parameter === 'zh') language = parameter;
  let select, labelText;
  function apply(value) {
    language = value === 'zh' ? 'zh' : 'en';
    document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
    document.title = language === 'zh' ? '显式时间推进动画' : 'Explicit time-stepping animation';
    frame.title = document.title;
    if (select) { select.value = language; select.setAttribute('aria-label', language === 'zh' ? '语言' : 'Language'); labelText.textContent = language === 'zh' ? '语言 ' : 'Language '; }
    frame.contentWindow?.postMessage({ type: 'cfd-language', language }, '*');
  }
  if (parent === window) {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;justify-content:flex-end;align-items:center;gap:8px;max-width:736px;margin:0 auto 12px;font:14px system-ui;color:inherit';
    labelText = document.createElement('span');
    select = document.createElement('select');
    select.style.cssText = 'font:inherit;padding:5px 12px;border-radius:20px';
    for (const [value, name] of [['en', 'English'], ['zh', '中文']]) { const option = document.createElement('option'); option.value = value; option.textContent = name; select.append(option); }
    select.addEventListener('change', () => {
      apply(select.value);
      try { localStorage.setItem('cfd-language', language); } catch {}
      try { const url = new URL(location.href); url.searchParams.set('lang', language); history.replaceState(null, '', url.pathname + url.search + url.hash); } catch {}
    });
    label.append(labelText, select); frame.before(label);
  }
  window.addEventListener('message', event => {
    if (event.source === parent && parent !== window && event.data?.type === 'cfd-language' && ['en', 'zh'].includes(event.data.language)) apply(event.data.language);
    if (event.source === frame.contentWindow && event.data?.type === 'cfd-language-ready') { apply(language); if (parent !== window) parent.postMessage({ type: 'cfd-language-ready' }, '*'); }
  });
  frame.addEventListener('load', () => apply(language));
  apply(language);
  if (parent !== window) parent.postMessage({ type: 'cfd-language-ready' }, '*');
})();
</script>
